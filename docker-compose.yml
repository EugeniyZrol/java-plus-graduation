services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: ewm_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      CLUSTER_ID: "K0EA9p0yEe6MkAAAAkKsEg"
    command: >
      bash -c "
      /opt/kafka/bin/kafka-storage.sh format --ignore-formatted -t $${CLUSTER_ID} -c /opt/kafka/config/kraft/server.properties &&
      /opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/kraft/server.properties &
      sleep 30 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --topic stats.user-actions.v1 --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --topic stats.events-similarity.v1 --partitions 1 --replication-factor 1 &&
      wait"

  stats-db:
    image: postgres:15-alpine
    container_name: ewm_stats_db
    environment:
      POSTGRES_DB: stats
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"

  main-db:
    image: postgres:15-alpine
    container_name: ewm_main_db
    environment:
      POSTGRES_DB: main
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"