server:
  port: 0

grpc:
  server:
    port: 0

spring:
  application:
    name: analyzer
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5433/stats
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: analyzer-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: ru.practicum.ewm.stats.kafka.AvroDeserializer
      properties:
        value.deserializer.target.type: ru.practicum.ewm.stats.avro.EventSimilarityAvro
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 500
    listener:
      auto-startup: false
      missing-topics-fatal: false
      concurrency: 3

analyzer:
  kafka:
    consumer:
      user-actions-topic: stats.user-actions.v1
      similarity-topic: stats.events-similarity.v1
      poll-timeout: 100ms

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

logging:
  level:
    ru.practicum.ewm.stats.analyzer: DEBUG