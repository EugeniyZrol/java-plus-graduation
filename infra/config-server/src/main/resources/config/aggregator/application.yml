server:
  port: 0

grpc:
  server:
    port: 0

spring:
  application:
    name: aggregator
  cloud:
    config:
      enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: ru.practicum.ewm.stats.kafka.AvroDeserializer
        spring.json.trusted.packages: "*"
        value.deserializer.target.type: ru.practicum.ewm.stats.avro.UserActionAvro
      group-id: aggregator-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 500
    producer:
      value-serializer: ru.practicum.ewm.stats.kafka.AvroSerializer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        acks: all
        retries: 3
    listener:
      missing-topics-fatal: false
      concurrency: 3

aggregator:
  kafka:
    consumer:
      topic: stats.user-actions.v1
      poll-timeout: 100ms
    producer:
      topic: stats.events-similarity.v1
      compression-type: snappy

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    metadata-map:
      grpc.port: 9095
    hostname: localhost
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

logging:
  level:
    ru.practicum.ewm.stats.aggregator: DEBUG