server:
  port: 9095

grpc:
  server:
    port: 0

spring:
  application:
    name: aggregator
  cloud:
    config:
      enabled: false
  kafka:
    bootstrap-servers: localhost:9092

aggregator:
  kafka:
    consumer:
      bootstrap-servers: ${spring.kafka.bootstrap-servers}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: aggregator-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 500
      poll-timeout-ms: 100
    producer:
      bootstrap-servers: ${spring.kafka.bootstrap-servers}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: ru.practicum.ewm.stats.kafka.AvroSerializer
      acks: all
      retries: 3
      compression-type: snappy
      batch-size: 16384
      linger-ms: 10
    topics:
      user-actions: stats.user-actions.v1
      events-similarity: stats.events-similarity.v1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    metadata-map:
      grpc.port: 9095
    hostname: localhost
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

logging:
  level:
    ru.practicum.ewm.stats.aggregator: DEBUG