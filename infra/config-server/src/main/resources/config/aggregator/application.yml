server:
  port: 9095

spring:
  application:
    name: aggregator
  cloud:
    config:
      enabled: false

aggregator:
  kafka:
    topics:
      user-actions: stats.user-actions.v1
      events-similarity: stats.events-similarity.v1
    consumer:
      poll-timeout: 100ms
      properties:
        bootstrap.servers: localhost:9092
        group.id: aggregator-group
        key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value.deserializer: ru.practicum.ewm.stats.kafka.AvroDeserializer
        value.deserializer.target.type: ru.practicum.ewm.stats.avro.UserActionAvro
        auto.offset.reset: earliest
        enable.auto.commit: false
        max.poll.records: 500
    producer:
      properties:
        bootstrap.servers: localhost:9092
        key.serializer: org.apache.kafka.common.serialization.StringSerializer
        value.serializer: ru.practicum.ewm.stats.kafka.AvroSerializer
        acks: all
        retries: 3
        batch.size: 16384
        compression.type: snappy
        linger.ms: 10

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    enabled: true
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    prefer-ip-address: false

logging:
  level:
    ru.practicum.ewm.stats.aggregator: DEBUG